<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spell Operator 起動診断</title>
  <style>
    body{margin:0;padding:24px;background:#10131a;color:#f5f7ff;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    main{max-width:900px;margin:auto}
    h1{font:700 24px system-ui,sans-serif}
    p{font-family:system-ui,sans-serif;line-height:1.6}
    button{padding:10px 18px;font-weight:700;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#080a0f;border:1px solid #394050;border-radius:10px;padding:16px;line-height:1.55;min-height:220px}
    iframe{position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0}
  </style>
</head>
<body>
<main>
  <h1>Spell Operator 起動診断</h1>
  <p>このページが自動で公開ファイルとゲーム起動状態を確認します。結果欄をそのままスクリーンショットしてください。</p>
  <button id="rerun">再診断</button>
  <pre id="result">診断を開始しています...</pre>
  <iframe id="game-test" title="game boot test"></iframe>
</main>
<script>
(() => {
  const result = document.getElementById('result');
  const iframe = document.getElementById('game-test');
  const files = [
    'index.html',
    'js/field-model.js',
    'js/game.js',
    'js/game03-core.js',
    'js/tilemap-runtime.js',
    'js/game03-field.js',
    'js/game03-menu.js'
  ];

  const lines = [];
  const write = line => {
    lines.push(line);
    result.textContent = lines.join('\n');
  };

  async function checkFile(path, stamp) {
    try {
      const res = await fetch(`${path}?diag=${stamp}`, { cache: 'no-store' });
      const text = await res.text();
      write(`${res.ok ? 'OK ' : 'NG '} ${path}  HTTP ${res.status}  ${text.length} bytes`);
      if (path === 'index.html') {
        const match = text.match(/js\/game\.js\?v=(\d+)/);
        write(`    index game.js version: ${match ? match[1] : '見つからない'}`);
      }
      if (path === 'js/game.js') {
        write(`    boot diagnostics code: ${text.includes('boot-diagnostic') ? 'あり' : 'なし'}`);
      }
    } catch (error) {
      write(`NG  ${path}  ${error?.message || error}`);
    }
  }

  function inspectFrame(label) {
    try {
      const win = iframe.contentWindow;
      const doc = iframe.contentDocument;
      const boot = win?.SpellRuntimeBoot;
      const button = doc?.getElementById('start-button');
      write(`\n[${label}]`);
      write(`SpellRuntimeBoot: ${boot ? 'あり' : 'なし'}`);
      write(`ready: ${boot?.ready === true ? 'true' : String(boot?.ready)}`);
      write(`currentStep: ${boot?.currentStep || '(なし)'}`);
      write(`SpellGame03: ${win?.SpellGame03 ? 'あり' : 'なし'}`);
      write(`SpellField: ${win?.SpellField ? 'あり' : 'なし'}`);
      write(`start button: ${button ? `あり / disabled=${button.disabled} / text=${button.textContent}` : 'なし'}`);
      const diag = doc?.getElementById('boot-diagnostic');
      if (diag?.textContent) write(`画面内エラー: ${diag.textContent.replace(/\n/g, ' | ')}`);
    } catch (error) {
      write(`フレーム確認失敗: ${error?.message || error}`);
    }
  }

  async function run() {
    const stamp = Date.now();
    lines.length = 0;
    write(`Spell Operator 起動診断 ${new Date().toLocaleString('ja-JP')}`);
    write(`URL: ${location.href}`);
    write('\n[公開ファイル]');
    for (const file of files) await checkFile(file, stamp);

    write('\n[ゲーム起動テスト]');
    iframe.src = `./?diag=${stamp}`;
    await new Promise(resolve => {
      const timer = setTimeout(resolve, 5000);
      iframe.onload = () => { clearTimeout(timer); resolve(); };
    });
    inspectFrame('iframe load直後');
    await new Promise(resolve => setTimeout(resolve, 6500));
    inspectFrame('6.5秒後');
    write('\n--- 診断終了 ---');
    write('この結果をスクリーンショットしてChatGPTへ送ってください。');
  }

  document.getElementById('rerun').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
