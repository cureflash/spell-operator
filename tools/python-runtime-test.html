<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Spell Operator - Python Runtime Test</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0c1018;color:#eef2ff}
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:#0c1018}
    main{max-width:920px;margin:0 auto;display:grid;gap:14px}
    .panel{border:1px solid #30384f;border-radius:14px;background:#171d2b;padding:16px}
    h1{margin:0 0 8px;font-size:24px}
    h2{margin:0 0 10px;font-size:16px}
    p{margin:6px 0;color:#c4cada;line-height:1.6}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#090d12;padding:2px 5px;border-radius:5px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    button{appearance:none;border:1px solid #59627a;border-radius:10px;background:#292f42;color:#fff;padding:11px 15px;font-size:15px;font-weight:700}
    button.primary{background:#8371ea;border-color:#9384f3}
    button:disabled{opacity:.5}
    .status{display:inline-block;padding:5px 10px;border-radius:999px;background:#30384f;font-weight:800;font-size:13px}
    .status[data-kind="running"]{background:#32446b}
    .status[data-kind="good"]{background:#235238}
    .status[data-kind="bad"]{background:#6a3038}
    pre,textarea{width:100%;margin:0;border:1px solid #30384f;border-radius:10px;background:#090d12;color:#dce7ff;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px}
    pre{min-height:160px;max-height:320px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
    textarea{min-height:330px;resize:vertical}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    a{color:#b9adff}
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="meta"><h1>Python Runtime Test</h1><span id="diag-status" class="status">未実行</span></div>
      <p>ゲーム本体とは独立して、公式方式に近い <code>Module Worker → Pyodide 0.28.3</code> だけを検査します。</p>
      <p><code>print("str")</code> と <code>input()</code> の2件が通れば、iPad SafariでもブラウザPython実行自体は可能です。</p>
      <div class="actions">
        <button id="diag-start" class="primary" type="button">診断開始</button>
        <button id="diag-copy" type="button" disabled>診断JSONをコピー</button>
        <a href="../">ゲームへ戻る</a>
      </div>
    </section>

    <section class="panel">
      <h2>進行ログ</h2>
      <pre id="diag-log">診断開始を押してください。</pre>
    </section>

    <section class="panel">
      <h2>ChatGPT用診断JSON</h2>
      <p>失敗した場合は、下の内容を丸ごとこのチャットへ貼ってください。</p>
      <textarea id="diag-json" readonly spellcheck="false"></textarea>
    </section>
  </main>
  <script src="python-runtime-test.js?v=1"></script>
</body>
</html>
