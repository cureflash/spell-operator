<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell Operator Map Editor</title>
<style>
:root{--bg:#11131c;--panel:#1c2030;--line:#48506a;--text:#f3f4fa;--muted:#aeb6cc}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,"Noto Sans JP",monospace;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}header{height:62px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #30364a;background:#171a26}header h1{margin:0;font-size:17px}.status{margin-left:auto;color:var(--muted);font-size:11px}.main{min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 285px;gap:10px;padding:10px}.panel{min-height:0;background:var(--panel);border:1px solid #30364a;border-radius:9px;padding:10px;overflow:hidden}.left{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px}.right{overflow:auto}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.col{display:grid;gap:7px}.label{font-size:11px;color:var(--muted)}button,.button,select,input[type=number]{border:1px solid #69728e;background:#262b3d;color:#fff;border-radius:6px;padding:6px 8px}.primary{background:#665293;border-color:#a48adc}.danger{background:#693945}.active{outline:2px solid #c9b6fa;background:#5e4d87}input[type=file]{width:100%;font-size:11px;color:var(--muted)}.palette-wrap{min-height:0;overflow:auto;border:1px solid #414a63;background:#10131b;border-radius:6px;padding:4px}.palette-stage{position:relative;width:256px;min-height:1120px}.palette-stage canvas{display:block;image-rendering:pixelated}.palette-cursor{position:absolute;width:32px;height:32px;border:3px solid #fff;box-shadow:0 0 0 2px #6a4ca9;pointer-events:none;display:none}.center{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.map-scroll{min-height:0;overflow:auto;background:#0c0e15;border:1px solid #30364a;border-radius:8px;padding:18px}.map-frame{width:max-content;height:max-content;margin:auto;box-shadow:0 12px 35px #0008}#mapCanvas{display:block;image-rendering:pixelated;background:#181b28;cursor:crosshair}.note{padding:8px;border-left:3px solid #a68bdd;background:#151929;font-size:11px;color:#c9cfe0;line-height:1.55}.sep{height:1px;background:#343a50;margin:8px 0}.events{display:grid;grid-template-columns:1fr 1fr;gap:5px}.event-btn.active{outline:2px solid #fff}.coords{font-weight:700}@media(max-width:1050px){.main{grid-template-columns:270px minmax(0,1fr) 235px}}
</style></head><body><div class="app">
<header><h1>Spell Operator Map Editor</h1><select id="mapSelect"></select><span id="mapBadge"></span><span id="status" class="status">準備中</span></header>
<div class="main">
<section class="panel left">
 <div class="col"><strong>1. マップ / サイズ</strong><div class="row"><label>幅 <input id="mapWidth" type="number" min="4" max="160" style="width:66px"></label><label>高さ <input id="mapHeight" type="number" min="4" max="120" style="width:66px"></label><button id="resizeMap">サイズ変更</button></div><div class="note">マップを切り替えると編集内容はマップ別に自動保存されます。</div></div>
 <div class="col"><strong>2. タイルセット / レイヤー</strong><input id="tilesetFile" type="file" accept="image/*"><span id="tilesetInfo" class="label">未読込</span><div class="row" id="layerButtons"><button data-layer="base" class="active">床・壁</button><button data-layer="object">家具</button><button data-layer="upper">上層</button><button data-layer="collision">当たり判定</button></div><div class="row"><button id="undo">↶</button><button id="redo">↷</button><button id="clearLayer" class="danger">レイヤー消去</button></div><div class="label">左クリック/ドラッグ=配置　右クリック/ドラッグ=消去　Shift+左=スポイト</div></div>
 <div class="palette-wrap"><div class="palette-stage" id="paletteStage"><canvas id="paletteCanvas" width="256" height="1120"></canvas><div id="paletteCursor" class="palette-cursor"></div></div></div>
</section>
<section class="panel center"><div class="toolbar"><strong>3. 配置</strong><span>タイル <span id="tileIndex" class="coords">—</span></span><span>座標 <span id="cellPos" class="coords">—</span></span><span id="modeText" class="label"></span></div><div class="map-scroll"><div class="map-frame"><canvas id="mapCanvas"></canvas></div></div></section>
<aside class="panel right"><div class="col">
 <strong>4. イベント配置</strong><div id="eventHelp" class="note"></div><div id="eventButtons" class="events"></div><button id="cancelEvent">イベント配置を終了</button>
 <div class="sep"></div><strong>5. 保存・反映</strong><button id="applyGame" class="primary">このマップをゲームへ反映</button><button id="openGame">ゲームを開く</button><button id="saveDraft">編集状態を保存</button><button id="exportJson">JSONを書き出す</button><label class="button">JSONを読み込む<input id="importJson" type="file" accept="application/json" hidden></label><button id="resetMap" class="danger">このマップを初期状態へ戻す</button><button id="removeOverride">ゲーム反映を解除</button>
 <div class="sep"></div><div class="note">家2Fでは P=PC、S=階段、A=ソフィー開始、B=ルミエル開始を移動できます。ほかのマップは現在、タイル・当たり判定・サイズを編集できます。</div>
</div></aside></div></div>
<script>
(()=>{"use strict";
const TILE=32,MAX_W=160,MAX_H=120,MIN=4,BASELINE_HOUSE2="../assets/maps/house2-layout.json?v=2";
const MAPS={town:{name:"フルール村",w:20,h:14},school:{name:"学校",w:16,h:12},library:{name:"ピジブルの図書館",w:16,h:12},house1:{name:"ソフィーの家 1F",w:11,h:9},house2:{name:"ソフィーとルミエルの部屋",w:12,h:9},la_mer_city:{name:"ラメールシティ",w:144,h:104}};
const HOUSE2_EVENTS={pc:{label:"P PC",color:"rgba(95,215,229,.78)",fallback:{x:9,y:2}},stairs:{label:"S 階段",color:"rgba(233,196,93,.82)",fallback:{x:10,y:7}},playerStart:{label:"A ソフィー開始",color:"rgba(240,128,170,.82)",fallback:{x:10,y:6,facing:"up"}},followerStart:{label:"B ルミエル開始",color:"rgba(130,210,150,.82)",fallback:{x:10,y:7,facing:"up"}}};
const SOURCE={site:"ドット絵世界",page:"https://yms.main.jp/dotartworld/page2/tile-rooms01.html",credit:"ドット絵世界 / http://yms.main.jp",asset:"女の子用の部屋"};
const $=s=>document.querySelector(s),palette=$("#paletteCanvas"),pctx=palette.getContext("2d",{willReadFrequently:true}),map=$("#mapCanvas"),mctx=map.getContext("2d"),cursor=$("#paletteCursor");
let mapId="house2",W=12,H=9,state,events={},tilesetCanvas=null,selectedTile=-1,currentLayer="base",eventMode=null,painting=false,lastCell=-1,changed=false,previewImage=null,previewUrl=null,visualDirty=false,history=[],hi=-1,baselineHouse2=null;
const draftKey=id=>`spell-operator-tilemap-editor:${id}`,gameKey=id=>`spell-operator-tilemap:${id}`,tileKey="spell-operator-editor-tileset:dotartworld-room-girl";
const empty=(fill=-1)=>Array(W*H).fill(fill),deep=o=>JSON.parse(JSON.stringify(o));
function blankState(){return{layers:{base:empty(7),object:empty(-1),upper:empty(-1)},collision:empty(0)}}
function defaultsFor(id){const c=MAPS[id];W=c.w;H=c.h;const s=blankState();for(let x=0;x<W;x++){s.collision[x]=1;s.collision[(H-1)*W+x]=1}for(let y=1;y<H-1;y++){s.collision[y*W]=1;s.collision[y*W+W-1]=1}const ev={};if(id==="house2")Object.entries(HOUSE2_EVENTS).forEach(([k,v])=>ev[k]=deep(v.fallback));return{s,ev}}
function setStatus(t){$("#status").textContent=t}function fit(a,fill){const o=Array(W*H).fill(fill);if(Array.isArray(a))for(let i=0;i<Math.min(o.length,a.length);i++)o[i]=a[i];return o}
function normalize(data){state={layers:{base:fit(data?.layers?.base,7),object:fit(data?.layers?.object,-1),upper:fit(data?.layers?.upper,-1)},collision:fit(data?.collision,0)};events=deep(data?.events||data?.fixedEvents||{});if(mapId==="house2")Object.entries(HOUSE2_EVENTS).forEach(([k,v])=>events[k]??=deep(v.fallback));}
function setCanvas(){map.width=W*TILE;map.height=H*TILE;const scale=W>80?.5:W>40?1:2;map.style.width=(W*TILE*scale)+"px";map.style.height=(H*TILE*scale)+"px";$("#mapWidth").value=W;$("#mapHeight").value=H;$("#mapBadge").textContent=`${MAPS[mapId].name} ${W}×${H}`}
function snap(){return{W,H,state:deep(state),events:deep(events),visualDirty,previewUrl}}function push(){history=history.slice(0,hi+1);history.push(snap());if(history.length>80)history.shift();hi=history.length-1;syncUndo()}function syncUndo(){$("#undo").disabled=hi<=0;$("#redo").disabled=hi>=history.length-1}function restore(i){if(i<0||i>=history.length)return;hi=i;const s=history[i];W=s.W;H=s.H;state=deep(s.state);events=deep(s.events);visualDirty=s.visualDirty;setPreview(s.previewUrl);setCanvas();draw();syncUndo();renderEventButtons()}
function setPreview(url){previewUrl=url||null;previewImage=null;if(!url)return;const im=new Image();im.onload=()=>{previewImage=im;draw()};im.src=url}
function applyData(data){W=Math.max(MIN,Math.min(MAX_W,Number(data.width)||MAPS[mapId].w));H=Math.max(MIN,Math.min(MAX_H,Number(data.height)||MAPS[mapId].h));normalize(data);setPreview(data.renderedMap);visualDirty=!data.renderedMap;setCanvas();draw();renderEventButtons()}
async function loadMap(id){saveDraft(false);mapId=id;eventMode=null;$("#mapSelect").value=id;let d=null;try{d=JSON.parse(localStorage.getItem(draftKey(id)))}catch{}if(d?.state){W=d.W;H=d.H;state=d.state;events=d.events||{};visualDirty=!!d.visualDirty;setPreview(d.previewUrl)}else if(id==="house2"&&baselineHouse2){applyData(baselineHouse2)}else{const z=defaultsFor(id);state=z.s;events=z.ev;previewUrl=null;previewImage=null;visualDirty=true}setCanvas();history=[];hi=-1;push();draw();renderEventButtons();setStatus(`${MAPS[id].name} を編集中`)}
function saveDraft(show=true){if(!state)return;localStorage.setItem(draftKey(mapId),JSON.stringify({W,H,state,events,visualDirty,previewUrl}));if(show)setStatus("編集状態を保存しました")}
function resize(newW,newH){newW=Math.max(MIN,Math.min(MAX_W,Math.trunc(newW)));newH=Math.max(MIN,Math.min(MAX_H,Math.trunc(newH)));if(newW===W&&newH===H)return;const ow=W,oh=H,old=deep(state);W=newW;H=newH;const next=blankState(),cw=Math.min(ow,W),ch=Math.min(oh,H);for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const oi=y*ow+x,ni=y*W+x;for(const l of["base","object","upper"])next.layers[l][ni]=old.layers[l][oi];next.collision[ni]=old.collision[oi]}state=next;Object.keys(events).forEach(k=>{events[k].x=Math.min(W-1,events[k].x);events[k].y=Math.min(H-1,events[k].y)});previewUrl=null;previewImage=null;visualDirty=true;setCanvas();draw();push();setStatus(`サイズを ${W}×${H} に変更`)}
function prepareTileset(img){const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0);try{const d=x.getImageData(0,0,c.width,c.height),p=d.data;let alpha=false;for(let i=3;i<p.length;i+=4)if(p[i]<255){alpha=true;break}if(!alpha){const r=p[0],g=p[1],b=p[2];for(let i=0;i<p.length;i+=4)if(p[i]===r&&p[i+1]===g&&p[i+2]===b)p[i+3]=0;x.putImageData(d,0,0)}}catch{}tilesetCanvas=c;palette.width=c.width;palette.height=c.height;$("#paletteStage").style.width=c.width+"px";$("#paletteStage").style.minHeight=c.height+"px";drawPalette();$("#tilesetInfo").textContent=`${c.width}×${c.height}px`;draw();setStatus("タイルセット読込済み")}
function loadDataUrl(url,persist=true){const im=new Image();im.onload=()=>{prepareTileset(im);if(persist)localStorage.setItem(tileKey,url)};im.src=url}
function drawPalette(){pctx.clearRect(0,0,palette.width,palette.height);if(tilesetCanvas)pctx.drawImage(tilesetCanvas,0,0);pctx.strokeStyle="rgba(255,255,255,.18)";for(let x=0;x<=palette.width;x+=TILE){pctx.beginPath();pctx.moveTo(x+.5,0);pctx.lineTo(x+.5,palette.height);pctx.stroke()}for(let y=0;y<=palette.height;y+=TILE){pctx.beginPath();pctx.moveTo(0,y+.5);pctx.lineTo(palette.width,y+.5);pctx.stroke()}}
function drawTile(ctx,i,dx,dy){if(!tilesetCanvas||i<0)return;const cols=Math.floor(tilesetCanvas.width/TILE);ctx.drawImage(tilesetCanvas,(i%cols)*TILE,Math.floor(i/cols)*TILE,TILE,TILE,dx,dy,TILE,TILE)}function compose(){const c=document.createElement("canvas");c.width=W*TILE;c.height=H*TILE;const x=c.getContext("2d");for(const l of["base","object","upper"])state.layers[l].forEach((t,i)=>drawTile(x,t,(i%W)*TILE,Math.floor(i/W)*TILE));return c}
function marker(p,label,color){if(!p||p.x<0||p.y<0||p.x>=W||p.y>=H)return;const x=p.x*TILE,y=p.y*TILE;mctx.fillStyle=color;mctx.fillRect(x+4,y+4,24,24);mctx.fillStyle="#111";mctx.font="bold 13px monospace";mctx.textAlign="center";mctx.textBaseline="middle";mctx.fillText(label,x+16,y+16)}
function draw(){mctx.clearRect(0,0,map.width,map.height);mctx.fillStyle="#181b28";mctx.fillRect(0,0,map.width,map.height);if(tilesetCanvas)mctx.drawImage(compose(),0,0);else if(previewImage)mctx.drawImage(previewImage,0,0,map.width,map.height);state.collision.forEach((v,i)=>{if(v){mctx.fillStyle="rgba(216,68,85,.32)";mctx.fillRect((i%W)*TILE,Math.floor(i/W)*TILE,TILE,TILE)}});mctx.strokeStyle="rgba(255,255,255,.22)";for(let x=0;x<=W*TILE;x+=TILE){mctx.beginPath();mctx.moveTo(x+.5,0);mctx.lineTo(x+.5,H*TILE);mctx.stroke()}for(let y=0;y<=H*TILE;y+=TILE){mctx.beginPath();mctx.moveTo(0,y+.5);mctx.lineTo(W*TILE,y+.5);mctx.stroke()}if(mapId==="house2")Object.entries(HOUSE2_EVENTS).forEach(([k,v])=>marker(events[k],v.label[0],v.color));}
function cell(ev){const r=map.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)*map.width/r.width/TILE),y=Math.floor((ev.clientY-r.top)*map.height/r.height/TILE);return x>=0&&y>=0&&x<W&&y<H?{x,y,i:y*W+x}:null}
function syncCursor(){if(selectedTile<0||!tilesetCanvas){cursor.style.display="none";$("#tileIndex").textContent="—";return}const cols=Math.floor(tilesetCanvas.width/TILE);cursor.style.display="block";cursor.style.left=(selectedTile%cols)*TILE+"px";cursor.style.top=Math.floor(selectedTile/cols)*TILE+"px";$("#tileIndex").textContent=selectedTile}
function paint(c,erase=false,eye=false){if(eventMode){events[eventMode]={...(events[eventMode]||{}),x:c.x,y:c.y};state.collision[c.i]=0;eventMode=null;renderEventButtons();draw();push();setStatus("イベント位置を移動しました");return}if(eye&&currentLayer!=="collision"){selectedTile=state.layers[currentLayer][c.i];syncCursor();return}if(currentLayer==="collision"){state.collision[c.i]=erase?0:(state.collision[c.i]?0:1);changed=true}else{if(!tilesetCanvas){setStatus("先にタイルセットPNGを読み込んでください");return}const after=erase?-1:selectedTile;if(after<0&&!erase)return;if(state.layers[currentLayer][c.i]!==after){state.layers[currentLayer][c.i]=after;changed=true;visualDirty=true;previewUrl=null;previewImage=null}}draw()}
function renderEventButtons(){const box=$("#eventButtons");box.innerHTML="";if(mapId!=="house2"){$("#eventHelp").textContent="このマップはタイル・当たり判定・サイズを編集できます。イベント移動は現在 house2 のPC/階段/開始位置に対応しています。";return}$("#eventHelp").textContent="移動したいイベントを選び、その後マップ上の移動先マスをクリック。";Object.entries(HOUSE2_EVENTS).forEach(([k,v])=>{const b=document.createElement("button");b.className="event-btn"+(eventMode===k?" active":"");b.textContent=`${v.label} (${events[k]?.x},${events[k]?.y})`;b.onclick=()=>{eventMode=k;renderEventButtons();$("#modeText").textContent=`${v.label} の移動先をクリック`};box.appendChild(b)})}
function rendered(){if(tilesetCanvas)return compose().toDataURL("image/png");if(!visualDirty&&previewUrl)return previewUrl;return null}function pack(){return{version:3,mapId,name:MAPS[mapId].name,width:W,height:H,tileSize:TILE,source:SOURCE,renderedMap:rendered(),layers:state.layers,collision:state.collision,events,updatedAt:new Date().toISOString()}}
Object.entries(MAPS).forEach(([id,c])=>{const o=document.createElement("option");o.value=id;o.textContent=c.name;$("#mapSelect").appendChild(o)});$("#mapSelect").value=mapId;$("#mapSelect").onchange=e=>loadMap(e.target.value);
$("#resizeMap").onclick=()=>resize(+$("#mapWidth").value,+$("#mapHeight").value);$("#layerButtons").onclick=e=>{const b=e.target.closest("[data-layer]");if(!b)return;currentLayer=b.dataset.layer;eventMode=null;document.querySelectorAll("#layerButtons button").forEach(x=>x.classList.toggle("active",x===b));renderEventButtons()};
palette.onclick=e=>{if(!tilesetCanvas)return;const r=palette.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*palette.width/r.width/TILE),y=Math.floor((e.clientY-r.top)*palette.height/r.height/TILE);selectedTile=y*Math.floor(palette.width/TILE)+x;syncCursor()};map.oncontextmenu=e=>e.preventDefault();map.onpointerdown=e=>{const c=cell(e);if(!c)return;painting=true;lastCell=c.i;changed=false;paint(c,e.button===2,e.shiftKey);map.setPointerCapture?.(e.pointerId)};map.onpointermove=e=>{const c=cell(e);$("#cellPos").textContent=c?`${c.x},${c.y}`:"—";if(!painting||!c||c.i===lastCell||e.shiftKey||eventMode)return;lastCell=c.i;if(currentLayer!=="collision")paint(c,(e.buttons&2)!==0,false)};window.onpointerup=()=>{if(painting&&changed)push();painting=false;lastCell=-1;changed=false};
$("#tilesetFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>loadDataUrl(r.result,true);r.readAsDataURL(f)};$("#undo").onclick=()=>restore(hi-1);$("#redo").onclick=()=>restore(hi+1);$("#clearLayer").onclick=()=>{if(currentLayer==="collision")state.collision=empty(0);else state.layers[currentLayer]=empty(-1);visualDirty=true;previewUrl=null;previewImage=null;draw();push()};$("#cancelEvent").onclick=()=>{eventMode=null;renderEventButtons();$("#modeText").textContent=""};
$("#saveDraft").onclick=()=>saveDraft(true);$("#applyGame").onclick=()=>{const d=pack();if(!d.renderedMap){alert("見た目を変更した場合は、タイルセットPNGを読み込んでから反映してください。");return}localStorage.setItem(gameKey(mapId),JSON.stringify(d));saveDraft(false);setStatus(`${MAPS[mapId].name} をゲームへ反映しました`)};$("#openGame").onclick=()=>window.open("../?mapedit=1&v=100","_blank");$("#removeOverride").onclick=()=>{localStorage.removeItem(gameKey(mapId));setStatus("このマップのゲーム反映を解除しました")};$("#exportJson").onclick=()=>{const d=pack();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download=`${mapId}-layout.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("#importJson").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),id=MAPS[d.mapId]?d.mapId:mapId;if(id!==mapId){saveDraft(false);mapId=id;$("#mapSelect").value=id}applyData(d);history=[];hi=-1;push();setStatus("JSONを読み込みました")}catch{alert("JSONを読み込めませんでした")}};r.readAsText(f)};$("#resetMap").onclick=()=>{localStorage.removeItem(draftKey(mapId));loadMap(mapId)};
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();restore(e.shiftKey?hi+1:hi-1)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();restore(hi+1)}});
(async()=>{try{const r=await fetch(BASELINE_HOUSE2,{cache:"no-store"});if(r.ok)baselineHouse2=await r.json()}catch{}const saved=localStorage.getItem(tileKey);if(saved)loadDataUrl(saved,false);else drawPalette();await loadMap("house2")})();
})();
</script></body></html>
