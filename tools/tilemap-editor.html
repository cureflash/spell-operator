<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell Operator Map Editor</title>
<style>
:root{--bg:#11131c;--panel:#1c2030;--text:#f3f4fa;--muted:#aeb6cc;--accent:#a68bdd}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,"Noto Sans JP",monospace;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:60px 1fr}header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #30364a;background:#171a26}header h1{margin:0;font-size:17px}.status{margin-left:auto;color:var(--muted);font-size:11px}.main{min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr) 280px;gap:10px;padding:10px}.panel{min-height:0;background:var(--panel);border:1px solid #30364a;border-radius:9px;padding:10px;overflow:hidden}.left{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:9px}.right{overflow:auto}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.col{display:grid;gap:7px}.label{font-size:11px;color:var(--muted)}button,.button,select,input[type=number]{border:1px solid #69728e;background:#262b3d;color:#fff;border-radius:6px;padding:6px 8px}.primary{background:#665293;border-color:#a48adc}.danger{background:#693945}.active{outline:2px solid #c9b6fa;background:#5e4d87}input[type=file]{width:100%;font-size:11px;color:var(--muted)}.palette-controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette-controls label{display:grid;gap:3px;font-size:10px;color:var(--muted)}.palette-controls label:first-child{grid-column:1/-1}.palette-wrap{min-height:0;overflow:auto;border:1px solid #414a63;background:#10131b;border-radius:6px;padding:4px}.palette-stage{position:relative;width:256px;min-height:32px}.palette-stage canvas{display:block;image-rendering:pixelated}.palette-cursor{position:absolute;width:32px;height:32px;border:3px solid #fff;box-shadow:0 0 0 2px #6a4ca9,0 0 12px #000;pointer-events:none;display:none}.center{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.map-scroll{min-height:0;overflow:auto;background:#0c0e15;border:1px solid #30364a;border-radius:8px;padding:18px}.map-frame{width:max-content;height:max-content;margin:auto;box-shadow:0 12px 35px #0008;background:#181b28}#mapCanvas{display:block;image-rendering:pixelated;cursor:crosshair}.note{padding:8px;border-left:3px solid var(--accent);background:#151929;font-size:11px;color:#c9cfe0;line-height:1.55}.sep{height:1px;background:#343a50;margin:8px 0}.events{display:grid;grid-template-columns:1fr 1fr;gap:5px}.event-btn.active{outline:2px solid #fff}.coords{font-weight:700}.stamp-badge{padding:3px 7px;border:1px solid #61567a;border-radius:999px;background:#211d2d;font-size:11px;color:#ded4fa}@media(max-width:1100px){.main{grid-template-columns:300px minmax(0,1fr) 240px}}
</style>
</head>
<body>
<div class="app">
<header><h1>Spell Operator Map Editor</h1><select id="mapSelect"></select><span id="mapBadge"></span><span id="status" class="status">準備中</span></header>
<div class="main">
<section class="panel left">
  <div class="col">
    <strong>1. マップ / サイズ</strong>
    <div class="row"><label>幅 <input id="mapWidth" type="number" min="4" max="160" style="width:66px"></label><label>高さ <input id="mapHeight" type="number" min="4" max="120" style="width:66px"></label><button id="resizeMap">サイズ変更</button></div>
  </div>
  <div class="col">
    <strong>2. パレット / レイヤー</strong>
    <div class="palette-controls">
      <label>素材セット<select id="paletteSet"></select></label>
      <label>種類<select id="paletteType"></select></label>
      <label>バリエーション<select id="paletteVariant"></select></label>
    </div>
    <div class="row"><label class="button">ローカル素材を読み込む<input id="tilesetFile" type="file" accept="image/*" hidden></label><span id="tilesetInfo" class="label"></span></div>
    <div class="row" id="layerButtons"><button data-layer="base" class="active">床・壁</button><button data-layer="object">家具</button><button data-layer="upper">上層</button><button data-layer="collision">当たり判定</button></div>
    <div class="row"><button id="undo">↶</button><button id="redo">↷</button><button id="clearLayer" class="danger">レイヤー消去</button></div>
    <div class="note">パレット上をドラッグすると複数チップを矩形選択できます。例：縦3チップのベッドを3マスまとめて選択 → マップを1クリックで一括配置。</div>
  </div>
  <div class="palette-wrap"><div class="palette-stage" id="paletteStage"><canvas id="paletteCanvas" width="256" height="32"></canvas><div id="paletteCursor" class="palette-cursor"></div></div></div>
</section>
<section class="panel center">
  <div class="toolbar"><strong>3. 配置</strong><span id="paletteName" class="label"></span><span class="stamp-badge">選択 <span id="stampSize">—</span></span><span>座標 <span id="cellPos" class="coords">—</span></span><span id="modeText" class="label"></span></div>
  <div class="map-scroll"><div class="map-frame" id="mapFrame"><canvas id="mapCanvas"></canvas></div></div>
</section>
<aside class="panel right"><div class="col">
  <strong>4. イベント配置</strong><div id="eventHelp" class="note"></div><div id="eventButtons" class="events"></div><button id="cancelEvent">イベント配置を終了</button>
  <div class="sep"></div><strong>5. 保存・プレビュー</strong><button id="applyGame" class="primary">このマップをプレビューへ反映</button><button id="openGame">プレビューゲームを開く</button><button id="saveDraft">編集状態を保存</button><button id="exportJson">JSONを書き出す</button><label class="button">JSONを読み込む<input id="importJson" type="file" accept="application/json" hidden></label><button id="resetMap" class="danger">このマップを初期状態へ戻す</button><button id="removeOverride">プレビュー反映を解除</button>
  <div class="sep"></div><div class="note">通常ゲームの正式マップは変更しません。パレットを切り替えても既に置いた別素材のチップは保持されるので、Pipoya＋女の子の部屋などを混在できます。</div>
</div></aside>
</div></div>
<script src="tilemap-editor.js?v=8"></script>
</body>
</html>
