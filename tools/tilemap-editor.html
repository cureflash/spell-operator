<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,"Noto Sans JP",monospace;overflow:hidden}

<div class="app">
<header><h1>Spell Operator Map Editor</h1><select id="mapSelect"></select><span id="mapBadge"></span><span id="status" class="status">準備中</span></header>
<div class="main">
<section class="panel left">

<div class="col"><strong>2. タイルセット / レイヤー</strong><input id="tilesetFile" type="file" accept="image/*"><span id="tilesetInfo" class="label">未読込</span><div class="row" id="layerButtons"><button data-layer="base" class="active">床・壁</button><button data-layer="object">家具</button><button data-layer="upper">上層</button><button data-layer="collision">当たり判定</button></div><div class="row"><button id="undo">↶</button><button id="redo">↷</button><button id="clearLayer" class="danger">レイヤー消去</button></div><div class="label">左クリック/ドラッグ=配置　右クリック/ドラッグ=消去　Shift+左=スポイト</div></div>

</section>

<aside class="panel right"><div class="col"><strong>4. イベント配置</strong><div id="eventHelp" class="note"></div><div id="eventButtons" class="events"></div><button id="cancelEvent">イベント配置を終了</button><div class="sep"></div><strong>5. 保存・反映</strong><button id="applyGame" class="primary">このマップをゲームへ反映</button><button id="openGame">ゲームを開く</button><button id="saveDraft">編集状態を保存</button><button id="exportJson">JSONを書き出す</button><label class="button">JSONを読み込む<input id="importJson" type="file" accept="application/json" hidden></label><button id="resetMap" class="danger">このマップを初期状態へ戻す</button><button id="removeOverride">ゲーム反映を解除</button><div class="sep"></div><div class="note">家2Fでは P=PC、S=階段、A=ソフィー開始、B=ルミエル開始を移動できます。</div></div></aside>
</div></div>

function scale(){return W>80?.5:W>40?1:2}function setCanvas(){map.width=W*TILE;map.height=H*TILE;const s=scale(),pw=W*TILE*s,ph=H*TILE*s;map.style.width=pw+"px";map.style.height=ph+"px";$("#mapFrame").style.width=pw+"px";$("#mapFrame").style.height=ph+"px";world.style.width=pw+"px";world.style.height=ph+"px";world.style.setProperty("--tile-size",TILE*s+"px");$("#mapWidth").value=W;$("#mapHeight").value=H;$("#mapBadge").textContent=`${MAPS[mapId].name} ${W}×${H}`;renderBaseline()}

const MT=()=>"tree la-mer-mountain",RD=()=>"path la-mer-road",PV=()=>"path la-mer-pavement",ST=()=>"path la-mer-stone",HB=()=>"path la-mer-harbor",PI=()=>"path la-mer-pier",SD=()=>"path la-mer-sand",GR=()=>"grass",WT=()=>"water",BL=(k="la-mer-shop")=>`building ${k}`,RF=(k="la-mer-shop")=>`roof ${k}`,DR=(k="la-mer-shop")=>`door ${k}`;

function resize(nw,nh){nw=Math.max(MIN,Math.min(MAX_W,Math.trunc(nw)));nh=Math.max(MIN,Math.min(MAX_H,Math.trunc(nh)));if(nw===W&&nh===H)return;const ow=W,oh=H,old=deep(state);W=nw;H=nh;const n=blankState();for(let y=0;y<Math.min(oh,H);y++)for(let x=0;x<Math.min(ow,W);x++){const oi=y*ow+x,ni=y*W+x;for(const l of["base","object","upper"])n.layers[l][ni]=old.layers[l][oi];n.collision[ni]=old.collision[oi]}state=n;for(const e of Object.values(events)){e.x=Math.min(W-1,e.x);e.y=Math.min(H-1,e.y)}setCanvas();draw();push()}
function prepareTileset(img){const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0);try{const d=x.getImageData(0,0,c.width,c.height),p=d.data;let alpha=false;for(let i=3;i<p.length;i+=4)if(p[i]<255){alpha=true;break}if(!alpha){const r=p[0],g=p[1],b=p[2];for(let i=0;i<p.length;i+=4)if(p[i]===r&&p[i+1]===g&&p[i+2]===b)p[i+3]=0;x.putImageData(d,0,0)}}catch{}tilesetCanvas=c;palette.width=c.width;palette.height=c.height;$("#paletteStage").style.width=c.width+"px";$("#paletteStage").style.minHeight=c.height+"px";drawPalette();$("#tilesetInfo").textContent=`${c.width}×${c.height}px`;draw()}function loadDataUrl(url,persist=true){const im=new Image();im.onload=()=>{prepareTileset(im);if(persist)localStorage.setItem(tileKey,url)};im.src=url}
function drawPalette(){pctx.clearRect(0,0,palette.width,palette.height);if(tilesetCanvas)pctx.drawImage(tilesetCanvas,0,0);pctx.strokeStyle="rgba(255,255,255,.18)";for(let x=0;x<=palette.width;x+=TILE){pctx.beginPath();pctx.moveTo(x+.5,0);pctx.lineTo(x+.5,palette.height);pctx.stroke()}for(let y=0;y<=palette.height;y+=TILE){pctx.beginPath();pctx.moveTo(0,y+.5);pctx.lineTo(palette.width,y+.5);pctx.stroke()}}function drawTile(ctx,i,dx,dy){if(!tilesetCanvas||i<0)return;const c=Math.floor(tilesetCanvas.width/TILE),sx=i%c*TILE,sy=Math.floor(i/c)*TILE;ctx.drawImage(tilesetCanvas,sx,sy,TILE,TILE,dx,dy,TILE,TILE)}function compose(){const c=document.createElement("canvas");c.width=W*TILE;c.height=H*TILE;const x=c.getContext("2d");for(const l of["base","object","upper"])state.layers[l].forEach((t,i)=>drawTile(x,t,i%W*TILE,Math.floor(i/W)*TILE));return c}
function marker(p,t,color){if(!p||p.x<0||p.y<0||p.x>=W||p.y>=H)return;const x=p.x*TILE,y=p.y*TILE;mctx.fillStyle=color;mctx.fillRect(x+5,y+5,TILE-10,TILE-10);mctx.fillStyle="#111";mctx.font="bold 14px monospace";mctx.textAlign="center";mctx.textBaseline="middle";mctx.fillText(t,x+TILE/2,y+TILE/2)}function draw(){mctx.clearRect(0,0,map.width,map.height);if(tilesetCanvas)mctx.drawImage(compose(),0,0);if(currentLayer==="collision")state.collision.forEach((v,i)=>{if(v){mctx.fillStyle="rgba(216,68,85,.32)";mctx.fillRect(i%W*TILE,Math.floor(i/W)*TILE,TILE,TILE)}});mctx.strokeStyle="rgba(255,255,255,.22)";for(let x=0;x<=W*TILE;x+=TILE){mctx.beginPath();mctx.moveTo(x+.5,0);mctx.lineTo(x+.5,H*TILE);mctx.stroke()}for(let y=0;y<=H*TILE;y+=TILE){mctx.beginPath();mctx.moveTo(0,y+.5);mctx.lineTo(W*TILE,y+.5);mctx.stroke()}if(mapId==="house2")for(const[k,v]of Object.entries(EVENTS))marker(events[k],v.mark,v.color)}
function cell(e){const r=map.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*map.width/r.width/TILE),y=Math.floor((e.clientY-r.top)*map.height/r.height/TILE);return x>=0&&y>=0&&x<W&&y<H?{x,y,i:y*W+x}:null}function syncCursor(){if(selectedTile<0||!tilesetCanvas){cursor.style.display="none";$("#tileIndex").textContent="—";return}const c=Math.floor(tilesetCanvas.width/TILE);cursor.style.display="block";cursor.style.left=selectedTile%c*TILE+"px";cursor.style.top=Math.floor(selectedTile/c)*TILE+"px";$("#tileIndex").textContent=selectedTile}
function paint(c,erase=false,eye=false){if(eventMode){events[eventMode]={...(events[eventMode]||{}),x:c.x,y:c.y};state.collision[c.i]=0;eventMode=null;renderEventButtons();draw();push();return}if(eye&&currentLayer!=="collision"){selectedTile=state.layers[currentLayer][c.i];syncCursor();return}if(currentLayer==="collision"){state.collision[c.i]=erase?0:(state.collision[c.i]?0:1);changed=true}else{if(!tilesetCanvas){setStatus("先にタイルセットPNGを読み込んでください");return}const a=state.layers[currentLayer],v=erase?-1:selectedTile;if(a[c.i]!==v){a[c.i]=v;changed=true}}draw()}
function renderEventButtons(){const b=$("#eventButtons"),h=$("#eventHelp");b.innerHTML="";if(mapId!=="house2"){h.textContent="このマップは現在タイル・サイズ・当たり判定を編集できます。";$("#cancelEvent").disabled=true;return}h.textContent="移動したいイベントを押してから、移動先のマスをクリック。";$("#cancelEvent").disabled=false;for(const[k,v]of Object.entries(EVENTS)){const x=document.createElement("button"),p=events[k]||v.fallback;x.className="event-btn"+(eventMode===k?" active":"");x.textContent=`${v.label} (${p.x},${p.y})`;x.onclick=()=>{eventMode=k;$("#modeText").textContent=`${v.label} の移動先をクリック`;renderEventButtons()};b.appendChild(x)}}function pack(){return{version:4,mapId,name:MAPS[mapId].name,width:W,height:H,tileSize:TILE,source:SOURCE,renderedMap:tilesetCanvas?compose().toDataURL("image/png"):null,layers:state.layers,collision:state.collision,events:deep(events),fixedEvents:deep(events),updatedAt:new Date().toISOString()}}
for(const[id,c]of Object.entries(MAPS)){const o=document.createElement("option");o.value=id;o.textContent=c.name;$("#mapSelect").appendChild(o)}$("#mapSelect").onchange=e=>loadMap(e.target.value);$("#resizeMap").onclick=()=>resize(+$("#mapWidth").value,+$("#mapHeight").value);$("#layerButtons").onclick=e=>{const b=e.target.closest("[data-layer]");if(!b)return;currentLayer=b.dataset.layer;eventMode=null;document.querySelectorAll("#layerButtons button").forEach(x=>x.classList.toggle("active",x===b));renderEventButtons();draw()};palette.onclick=e=>{if(!tilesetCanvas)return;const r=palette.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*palette.width/r.width/TILE),y=Math.floor((e.clientY-r.top)*palette.height/r.height/TILE);selectedTile=y*Math.floor(palette.width/TILE)+x;syncCursor()};map.oncontextmenu=e=>e.preventDefault();map.onpointerdown=e=>{const c=cell(e);if(!c)return;painting=true;lastCell=c.i;changed=false;paint(c,e.button===2,e.shiftKey);map.setPointerCapture?.(e.pointerId)};map.onpointermove=e=>{const c=cell(e);$("#cellPos").textContent=c?`${c.x},${c.y}`:"—";if(!painting||!c||c.i===lastCell||e.shiftKey||eventMode)return;lastCell=c.i;if(currentLayer!=="collision")paint(c,(e.buttons&2)!==0,false)};window.onpointerup=()=>{if(painting&&changed)push();painting=false;lastCell=-1;changed=false};
$("#tilesetFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>loadDataUrl(r.result,true);r.readAsDataURL(f)};$("#undo").onclick=()=>restore(hi-1);$("#redo").onclick=()=>restore(hi+1);$("#clearLayer").onclick=()=>{if(currentLayer==="collision")state.collision=empty(0);else state.layers[currentLayer]=empty(-1);draw();push()};$("#cancelEvent").onclick=()=>{eventMode=null;$("#modeText").textContent="";renderEventButtons()};$("#saveDraft").onclick=()=>saveDraft(true);$("#applyGame").onclick=()=>{const d=pack();localStorage.setItem(gameKey(mapId),JSON.stringify(d));saveDraft(false);setStatus(`${MAPS[mapId].name} をゲームへ反映しました`)};$("#openGame").onclick=()=>window.open("../?mapedit=1&v=102","_blank");$("#removeOverride").onclick=()=>{localStorage.removeItem(gameKey(mapId));setStatus("このマップのゲーム反映を解除しました")};$("#exportJson").onclick=()=>{const d=pack(),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download=`${mapId}-layout.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("#importJson").onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),id=MAPS[d.mapId]?d.mapId:mapId;mapId=id;$("#mapSelect").value=id;W=Number(d.width)||MAPS[id].w;H=Number(d.height)||MAPS[id].h;normalize(d);setCanvas();history=[];hi=-1;push();draw();renderEventButtons()}catch{alert("JSONを読み込めませんでした")}};r.readAsText(f)};$("#resetMap").onclick=()=>{localStorage.removeItem(draftKey(mapId));loadMap(mapId)};$("#mapScroll").addEventListener("scroll",()=>{if(mapId==="la_mer_city")requestAnimationFrame(renderLaMerVisible)});window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();restore(e.shiftKey?hi+1:hi-1)}});
(async()=>{try{const r=await fetch("../assets/maps/house2-layout.json?v=2",{cache:"no-store"});if(r.ok)baselineHouse2=await r.json()}catch{}const saved=localStorage.getItem(tileKey);if(saved)loadDataUrl(saved,false);else drawPalette();await loadMap("house2")})();
})();
