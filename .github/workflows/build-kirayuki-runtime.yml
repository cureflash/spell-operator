name: Build Kirayuki runtime asset

on:
  push:
    branches:
      - impl/plugin-kirayuki-transition
    paths:
      - .github/workflows/build-kirayuki-runtime.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime asset from supplied source derivative
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/effects/plugin
          python - <<'PY'
          import base64
          data = '''[... ELLIPSIZATION ...]'''
          with open('assets/effects/plugin/kirayuki1.webp','wb') as f:
              f.write(base64.b64decode(data))
          PY
          test -s assets/effects/plugin/kirayuki1.webp
          sha1sum assets/effects/plugin/kirayuki1.webp
      - name: Commit runtime asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/effects/plugin/kirayuki1.webp
          git commit -m "Add Kirayuki runtime effect asset" || exit 0
          git push
