name: Implement Kirayuki plug-in transition

on:
  push:
    branches:
      - impl/plugin-kirayuki-transition
    paths:
      - .github/workflows/build-kirayuki-runtime.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add transition controller and wire plug-in flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/effects/plugin
          cat > js/plugin-transition.js <<'EOF'
          (() => {
            "use strict";

            const SOURCE = "assets/effects/plugin/kirayuki1.webp";
            const FRAME_COUNT = 10;
            const FRAME_MS = 90;
            const image = new Image();
            image.decoding = "async";
            image.src = SOURCE;

            let canvas = null;
            let context = null;
            let playing = null;

            function ensureCanvas() {
              if (canvas) return;
              canvas = document.createElement("canvas");
              canvas.id = "plugin-kirayuki-transition";
              canvas.setAttribute("aria-hidden", "true");
              Object.assign(canvas.style, {
                position: "fixed",
                inset: "0",
                width: "100vw",
                height: "100vh",
                pointerEvents: "none",
                zIndex: "10000",
                display: "none"
              });
              document.body.appendChild(canvas);
              context = canvas.getContext("2d", { alpha: true });
            }

            async function ensureImage() {
              if (image.complete && image.naturalWidth) return;
              if (image.decode) {
                try {
                  await image.decode();
                  return;
                } catch (_) {}
              }
              await new Promise((resolve, reject) => {
                image.addEventListener("load", resolve, { once: true });
                image.addEventListener("error", reject, { once: true });
              });
            }

            function resize() {
              const dpr = Math.min(window.devicePixelRatio || 1, 2);
              const width = Math.max(1, window.innerWidth);
              const height = Math.max(1, window.innerHeight);
              canvas.width = Math.round(width * dpr);
              canvas.height = Math.round(height * dpr);
              context.setTransform(dpr, 0, 0, dpr, 0, 0);
              return { width, height };
            }

            function drawFrame(frame, width, height) {
              const frameWidth = image.naturalWidth;
              const frameHeight = image.naturalHeight / FRAME_COUNT;
              const scale = Math.max(width / frameWidth, height / frameHeight);
              const drawWidth = frameWidth * scale;
              const drawHeight = frameHeight * scale;
              context.clearRect(0, 0, width, height);
              context.save();
              context.globalCompositeOperation = "lighter";
              context.drawImage(
                image,
                0,
                frame * frameHeight,
                frameWidth,
                frameHeight,
                (width - drawWidth) / 2,
                (height - drawHeight) / 2,
                drawWidth,
                drawHeight
              );
              context.restore();
            }

            function delay(ms) {
              return new Promise(resolve => setTimeout(resolve, ms));
            }

            function play() {
              if (playing) return playing;
              playing = (async () => {
                ensureCanvas();
                await ensureImage();
                canvas.style.display = "block";
                for (let frame = 0; frame < FRAME_COUNT; frame += 1) {
                  const { width, height } = resize();
                  drawFrame(frame, width, height);
                  await delay(FRAME_MS);
                }
              })().finally(() => {
                if (context && canvas) {
                  const dpr = Math.min(window.devicePixelRatio || 1, 2);
                  context.setTransform(1, 0, 0, 1, 0, 0);
                  context.clearRect(0, 0, canvas.width * dpr, canvas.height * dpr);
                  canvas.style.display = "none";
                }
                playing = null;
              });
              return playing;
            }

            window.SpellPluginTransition = {
              play,
              isPlaying: () => Boolean(playing)
            };
          })();
          EOF

          cat > assets/effects/plugin/README.md <<'EOF'
          # Kirayuki plug-in transition

          - Source: user-supplied `キラ雪.zip`, `kirayuki1.png` (`キラキラ雪放射`).
          - Author: ぴぽや.
          - Runtime asset: `kirayuki1.webp`.
          - Runtime processing: ten sampled frames from the supplied 30-frame sheet, resized and encoded as WebP for browser playback.
          - The supplied readme permits commercial/noncommercial use, modification, redistribution, and use outside WOLF RPG Editor; standalone commercial sale of the asset itself is prohibited, and attribution/contact is not required.
          EOF

          python - <<'PY'
          from pathlib import Path

          menu_path = Path('js/game03-menu.js')
          menu = menu_path.read_text()
          old = '''  function continuePlugin(){
            const dialog=$("#field-dialog");
            if(!dialog||dialog.dataset.pluginPrompt!=="1"||!dialogIsOpen())return false;
            delete dialog.dataset.pluginPrompt;
            $("#field-action")?.click();
            G.openComputer?.();
            return true;
          }
          '''
          new = '''  function continuePlugin(){
            const dialog=$("#field-dialog");
            if(!dialog||dialog.dataset.pluginPrompt!=="1"||!dialogIsOpen())return false;
            delete dialog.dataset.pluginPrompt;
            $("#field-action")?.click();
            Promise.resolve(window.SpellPluginTransition?.play?.())
              .catch(error=>console.error("Plugin transition failed",error))
              .then(()=>G.openComputer?.());
            return true;
          }
          '''
          if old not in menu:
              raise SystemExit('continuePlugin target not found')
          menu = menu.replace(old, new, 1)
          old = '''  function onFieldMenuKeydown(event){
            if(storyOverlayIsOpen())return;
            if(travelCasting){event.preventDefault();event.stopImmediatePropagation();return}
          '''
          new = '''  function onFieldMenuKeydown(event){
            if(storyOverlayIsOpen())return;
            if(window.SpellPluginTransition?.isPlaying?.()){event.preventDefault();event.stopImmediatePropagation();return}
            if(travelCasting){event.preventDefault();event.stopImmediatePropagation();return}
          '''
          if old not in menu:
              raise SystemExit('keydown target not found')
          menu = menu.replace(old, new, 1)
          menu_path.write_text(menu)

          game_path = Path('js/game.js')
          game = game_path.read_text()
          old = '''    .then(()=>load("js/game03-items.js?v=3"))
            .then(()=>load("js/game03-menu.js?v=17"))
          '''
          new = '''    .then(()=>load("js/game03-items.js?v=3"))
            .then(()=>load("js/plugin-transition.js?v=1"))
            .then(()=>load("js/game03-menu.js?v=18"))
          '''
          if old not in game:
              raise SystemExit('game loader target not found')
          game = game.replace(old, new, 1)
          game_path.write_text(game)
          PY

          git rm .github/workflows/build-kirayuki-runtime.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/plugin-transition.js js/game03-menu.js js/game.js assets/effects/plugin/kirayuki1.webp assets/effects/plugin/README.md
          git commit -m "Add Kirayuki plug-in transition"
          git push
