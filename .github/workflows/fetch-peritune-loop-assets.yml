name: Fetch PeriTune loop assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-peritune-loop-assets.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try loop archives and replace runtime assets
        shell: bash
        run: |
          set -euo pipefail
          : > loop-fetch-diagnostic.txt

          fetch_loop() {
            key="$1"; url="$2"; output="$3"
            work="/tmp/$key"
            rm -rf "$work"; mkdir -p "$work/extracted"
            code=$(curl -L --silent --show-error -w '%{http_code}' -o "$work/loop.zip" "$url" || true)
            echo "$key zip_http=$code url=$url" >> loop-fetch-diagnostic.txt
            if [ "$code" = "200" ] && unzip -jo "$work/loop.zip" '*.mp3' -d "$work/extracted" >/dev/null 2>&1; then
              file=$(find "$work/extracted" -type f -iname '*.mp3' | head -n1 || true)
              if [ -n "$file" ]; then
                cp "$file" "$output"
                echo "$key loop_mp3=$(basename "$file") size=$(wc -c < "$output")" >> loop-fetch-diagnostic.txt
                return 0
              fi
            fi
            echo "$key loop_not_replaced" >> loop-fetch-diagnostic.txt
          }

          fetch_loop ancient_gust 'https://peritune.com/music/Peritune_Ancient_Gust_loop.zip' 'assets/audio/bgm/ancient-gust.mp3'
          fetch_loop resort5 'https://peritune.com/music/PerituneMaterial_Resort5_loop.zip' 'assets/audio/bgm/resort5.mp3'
          fetch_loop swift_strike 'https://peritune.com/music/Peritune_Swift_Strike_loop.zip' 'assets/audio/bgm/swift-strike.mp3'
          cat loop-fetch-diagnostic.txt

      - name: Commit replacements and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/bgm/ancient-gust.mp3 assets/audio/bgm/resort5.mp3 assets/audio/bgm/swift-strike.mp3 loop-fetch-diagnostic.txt
          git commit -m "Use PeriTune loop BGM assets when available" || exit 0
          git push
