<svg xmlns="http://www.w3.org/2000/svg" width="448" height="320" viewBox="0 0 448 320">
<defs>
  <pattern id="grass" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#79ad58"/>
    <path d="M6 23l2-5 1 5m15-12 1-4 2 4m-10 13 2-4 1 4" stroke="#5f9445" stroke-width="1" fill="none" opacity=".8"/>
    <circle cx="26" cy="25" r="1" fill="#93c86e"/><circle cx="11" cy="8" r="1" fill="#93c86e"/>
  </pattern>
  <pattern id="path" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#d8b77a"/>
    <circle cx="7" cy="9" r="1" fill="#b9915b"/><circle cx="23" cy="21" r="1.2" fill="#e8cb93"/><circle cx="13" cy="27" r=".8" fill="#aa8553"/>
    <path d="M3 16h4m17-7h3m-14 5h2" stroke="#c29b63" stroke-width="1" opacity=".75"/>
  </pattern>
  <pattern id="water" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#4fa1c6"/>
    <path d="M2 8h11m6 0h9M7 19h15M1 27h7m9 0h12" stroke="#83c8df" stroke-width="2" opacity=".75"/>
    <path d="M11 13h12M4 23h9" stroke="#337fa7" stroke-width="1" opacity=".65"/>
  </pattern>
  <pattern id="hedge" width="32" height="32" patternUnits="userSpaceOnUse">
    <rect width="32" height="32" fill="#3d7137"/>
    <circle cx="7" cy="9" r="8" fill="#568b43"/><circle cx="18" cy="8" r="9" fill="#609749"/><circle cx="27" cy="12" r="8" fill="#4c823f"/>
    <circle cx="9" cy="23" r="9" fill="#4e843e"/><circle cx="22" cy="23" r="10" fill="#5c9146"/>
    <circle cx="12" cy="8" r="2" fill="#78aa58"/><circle cx="25" cy="22" r="2" fill="#75a653"/>
  </pattern>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#665076"/><stop offset="1" stop-color="#4b395c"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7c69b"/><stop offset="1" stop-color="#b79d72"/></linearGradient>
</defs>
<rect width="448" height="320" fill="url(#grass)"/>
<!-- road -->
<rect x="64" y="128" width="320" height="128" fill="url(#path)"/>
<rect x="160" y="256" width="32" height="32" fill="url(#path)"/>
<!-- water pond -->
<rect x="320" y="32" width="96" height="64" rx="3" fill="url(#water)"/>
<path d="M320 32h96M320 96h96" stroke="#2f7897" stroke-width="3" opacity=".8"/>
<!-- tall grass -->
<g fill="#4e8a3c" stroke="#315f2c" stroke-width="1">
  <path d="M327 151l4-14 3 14 5-17 1 17 7-15-2 17z"/><path d="M359 151l4-15 3 15 6-17v17l7-14-2 16z"/><path d="M391 151l4-14 3 14 5-16 2 16 6-13-2 15z"/>
</g>
<!-- workshop -->
<g>
  <rect x="32" y="72" width="128" height="56" fill="#3f3b37" opacity=".25" transform="translate(3 4)"/>
  <rect x="32" y="72" width="128" height="56" fill="url(#wall)" stroke="#6e5d48" stroke-width="3"/>
  <polygon points="24,72 48,34 144,34 168,72" fill="url(#roof)" stroke="#352942" stroke-width="4"/>
  <path d="M31 65h130M43 52h106" stroke="#826c91" stroke-width="3" opacity=".65"/>
  <rect x="68" y="88" width="28" height="40" rx="2" fill="#6b4932" stroke="#3f2d24" stroke-width="3"/>
  <circle cx="90" cy="108" r="2" fill="#d9be6f"/>
  <rect x="111" y="85" width="30" height="24" fill="#86b7c4" stroke="#655740" stroke-width="3"/>
  <path d="M126 85v24M111 97h30" stroke="#d7eef1" stroke-width="2" opacity=".8"/>
  <circle cx="96" cy="57" r="13" fill="#2a3142" stroke="#c9ac60" stroke-width="3"/>
  <path d="M96 46l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#77d3df"/>
  <rect x="38" y="80" width="17" height="38" fill="#563f66" stroke="#3d3048" stroke-width="2"/>
  <path d="M46 88l4 8-4 8-4-8z" fill="#d6b657"/>
</g>
<!-- flowers -->
<g fill="#f0e7a0"><circle cx="208" cy="46" r="2"/><circle cx="210" cy="44" r="2"/><circle cx="206" cy="44" r="2"/><circle cx="369" cy="178" r="2"/><circle cx="371" cy="176" r="2"/><circle cx="367" cy="176" r="2"/></g>
<!-- hedge border -->
<rect x="0" y="0" width="448" height="32" fill="url(#hedge)"/>
<rect x="0" y="288" width="448" height="32" fill="url(#hedge)"/>
<rect x="0" y="32" width="32" height="256" fill="url(#hedge)"/>
<rect x="416" y="32" width="32" height="256" fill="url(#hedge)"/>
<!-- small shadows / stones -->
<g fill="#4f5f3f" opacity=".55"><ellipse cx="240" cy="117" rx="5" ry="3"/><ellipse cx="310" cy="268" rx="5" ry="3"/><ellipse cx="121" cy="260" rx="4" ry="2"/></g>
</svg>